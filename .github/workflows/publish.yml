name: Build & Publish

# Build the app on every merge to main: the Windows installer and the Linux AppImage, mirroring
# publish.bat and packaging/build-appimage.sh respectively. A push to main uploads nothing, so it
# is the no-regression gate. A pushed v* tag builds the same pair at the tag's version and
# attaches both to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A tag names the version; otherwise stamp a traceable CI version from the run number.
      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '1.0.0.${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # Zip the SpiceClient source BEFORE building so no bin/obj leaks in. The
      # installer ships this beside the app as LGPL "corresponding source"
      # (see installer\VirtDeck.iss [Files]); ISCC fails if it's missing.
      - name: Package SpiceClient source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Compress-Archive -Path SpiceClient -DestinationPath publish/SpiceClient-src.zip -Force

      - name: Restore
        run: dotnet restore VirtDeck.sln

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish VirtDeck.Avalonia/VirtDeck.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      # As publish.bat: the symbols are dead weight in the installer.
      - name: Drop debug symbols
        shell: pwsh
        run: Get-ChildItem publish/win-x64 -Recurse -Filter *.pdb | Remove-Item

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\VirtDeck.iss'

      - name: Upload installer
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/output/VirtDeckSetup-${{ steps.ver.outputs.version }}.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="1.0.0.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The script downloads appimagetool itself and runs it with APPIMAGE_EXTRACT_AND_RUN, so the
      # runner needs no FUSE and no extra packages.
      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Upload AppImage
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: publish/VirtDeck-${{ steps.ver.outputs.version }}-x86_64.AppImage

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "VirtDeck ${GITHUB_REF_NAME#v}" --generate-notes
