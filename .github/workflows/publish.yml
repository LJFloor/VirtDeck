name: Build & Publish

# Build the app on every merge to main and produce both release artifacts: the Windows installer
# and the Linux AppImage. Each is uploaded as a build artifact (downloadable from the run's
# "Artifacts" section). This mirrors publish.bat and packaging/build-appimage.sh respectively.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # No tag here, so stamp a traceable CI version from the run number.
      - name: Derive CI version
        id: ver
        shell: pwsh
        run: '"version=1.0.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT'

      # Zip the SpiceClient source BEFORE building so no bin/obj leaks in. The
      # installer ships this beside the app as LGPL "corresponding source"
      # (see installer\VirtDeck.iss [Files]); ISCC fails if it's missing.
      - name: Package SpiceClient source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Compress-Archive -Path SpiceClient -DestinationPath publish/SpiceClient-src.zip -Force

      - name: Restore
        run: dotnet restore VirtDeck.sln

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish VirtDeck.Avalonia/VirtDeck.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\VirtDeck.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtDeck-installer
          path: installer/output/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive CI version
        id: ver
        run: echo "version=1.0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The script downloads appimagetool itself and runs it with APPIMAGE_EXTRACT_AND_RUN, so the
      # runner needs no FUSE and no extra packages.
      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtDeck-AppImage
          path: publish/*.AppImage
          if-no-files-found: error
